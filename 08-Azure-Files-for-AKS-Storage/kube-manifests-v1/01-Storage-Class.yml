# MULTIPLE PODS CAN SHARE ACCESS TO SINGLE FILE SHARE

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: my-azurefile-sc
provisioner: kubernetes.io/azure-file
# can also define other things like our 05 file 
mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - uid=0
  - gid=0
  - mfsymlinks
  - cache=strict
parameters:
  skuName: Standard_LRS